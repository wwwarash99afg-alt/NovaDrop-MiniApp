<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaDrop Lucky Spin</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #08111f;
    color: white;
    min-height: 100vh;
}

/* APP */
.app {
    max-width: 700px;
    margin: auto;
    min-height: 100vh;
    padding-bottom: 100px;
}

/* HEADER */
.header {
    padding: 20px;
    text-align: center;
    background: #111c2d;
    border-bottom: 1px solid #26364d;
}

.header h1 {
    font-size: 28px;
    color: #2ed5e6;
}

/* DAILY REWARD */
.daily-box {
    margin: 20px;
    padding: 25px;
    background: #141f31;
    border-radius: 25px;
    border: 1px solid #253b58;
    text-align: center;
}

.daily-btn {
    border: none;
    background: #25c8dc;
    color: #06111c;
    padding: 16px 35px;
    font-size: 20px;
    font-weight: bold;
    border-radius: 18px;
    cursor: pointer;
}

.daily-btn:active {
    transform: scale(.96);
}

/* SPIN SECTION */
.spin-card {
    margin: 20px;
    padding: 30px 20px;
    border-radius: 30px;
    background: #141f31;
    border: 1px solid #24d7e8;
    box-shadow:
        0 0 10px rgba(36,215,232,.25),
        inset 0 0 30px rgba(0,0,0,.15);
}

.title {
    text-align: center;
    color: #2ed5e6;
    font-size: 32px;
    margin-bottom: 15px;
}

.subtitle {
    text-align: center;
    color: #b8c1ce;
    font-size: 18px;
    margin-bottom: 20px;
}

/* STATS */
.stats {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 30px;
}

.stat {
    flex: 1;
    max-width: 170px;
    background: #0c1525;
    border: 1px solid #263a56;
    border-radius: 20px;
    padding: 15px 8px;
    text-align: center;
}

.stat-name {
    color: #b9c3d1;
    font-size: 15px;
}

.stat-value {
    margin-top: 10px;
    font-size: 27px;
    font-weight: bold;
    color: #28d4e6;
}

/* WHEEL AREA */
.wheel-area {
    position: relative;
    width: 310px;
    height: 350px;
    margin: 0 auto 20px;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* POINTER */
.pointer {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    z-index: 20;
    width: 0;
    height: 0;
    border-left: 22px solid transparent;
    border-right: 22px solid transparent;
    border-top: 48px solid #ffffff;

    filter:
        drop-shadow(0 0 8px #25d8eb)
        drop-shadow(0 0 15px #25d8eb);
}

.pointer::after {
    content: "";
    position: absolute;
    top: -48px;
    left: -7px;
    width: 14px;
    height: 14px;
    background: #ffcc00;
    border-radius: 50%;
}

/* WHEEL */
.wheel-container {
    width: 290px;
    height: 290px;
    margin-top: 45px;
    position: relative;
}

.wheel {
    width: 290px;
    height: 290px;
    border-radius: 50%;
    position: relative;
    overflow: hidden;

    border: 8px solid #2bd7e8;

    background:
        conic-gradient(
            #ff5c5c 0deg 45deg,
            #ffd93d 45deg 90deg,
            #7c5cff 90deg 135deg,
            #25d8a5 135deg 180deg,
            #ff914d 180deg 225deg,
            #4ea8ff 225deg 270deg,
            #ff6ec7 270deg 315deg,
            #8bd450 315deg 360deg
        );

    box-shadow:
        0 0 15px #25d8e8,
        0 0 40px rgba(37,216,232,.4),
        inset 0 0 25px rgba(255,255,255,.3);

    transition: transform 5s cubic-bezier(.17,.67,.15,1);
}

/* CENTER */
.wheel-center {
    position: absolute;
    width: 82px;
    height: 82px;
    background: #0b1423;
    border: 6px solid #ffffff;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 30px;

    box-shadow:
        0 0 10px white,
        0 0 25px #24d8e8;
}

/* LABELS */
.label {
    position: absolute;
    width: 90px;
    text-align: center;
    font-size: 16px;
    font-weight: bold;
    color: white;
    text-shadow: 0 2px 4px black;
}

/* Wheel reward positions */
.label1 { top: 28px; left: 100px; }
.label2 { top: 55px; right: 22px; }
.label3 { top: 130px; right: 5px; }
.label4 { bottom: 48px; right: 25px; }
.label5 { bottom: 20px; left: 100px; }
.label6 { bottom: 48px; left: 20px; }
.label7 { top: 130px; left: 5px; }
.label8 { top: 55px; left: 20px; }

/* SPIN BUTTON */
.spin-btn {
    width: 100%;
    border: none;
    background: #25c8dc;
    color: #07111e;
    font-size: 26px;
    font-weight: bold;
    padding: 22px;
    border-radius: 20px;
    cursor: pointer;

    box-shadow: 0 8px 25px rgba(37,200,220,.3);
}

.spin-btn:active {
    transform: scale(.98);
}

.spin-btn:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* RESULT */
.result {
    min-height: 30px;
    text-align: center;
    margin-top: 20px;
    color: #2ed5e6;
    font-size: 20px;
    font-weight: bold;
}

/* INFO */
.info {
    text-align: center;
    margin-top: 25px;
    color: #42d9e9;
    font-size: 18px;
    font-weight: bold;
    line-height: 1.5;
}

/* BOTTOM NAV */
.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    background: #0c1525;
    border-top: 1px solid #26364d;
    display: flex;
    justify-content: center;
    gap: 60px;
    padding: 15px;
}

.nav-item {
    text-decoration: none;
    color: #b7c0ce;
    text-align: center;
    font-size: 16px;
}

.nav-item.active {
    color: #2ed5e6;
}

.nav-icon {
    display: block;
    font-size: 25px;
    margin-bottom: 5px;
}

/* MOBILE */
@media (max-width: 400px) {

    .wheel-area {
        transform: scale(.88);
        margin-top: -15px;
        margin-bottom: -10px;
    }

    .stats {
        gap: 7px;
    }

    .stat-value {
        font-size: 22px;
    }

    .title {
        font-size: 27px;
    }
}
</style>

</head>

<body>

    <!-- HEADER -->
    <div class="header">
        <h1>NovaDrop</h1>
    </div>


    <!-- DAILY REWARD -->

            Claim Daily Reward
