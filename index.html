<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>NovaDrop</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --bg: #07111f;
      --card: #101d2d;
      --card-dark: #0b1726;
      --line: #20344b;

      --text: #f4f8ff;
      --muted: #91a1b7;

      --cyan: #28d9e9;
      --green: #48df9a;
      --yellow: #ffd166;
    }


    html {
      scroll-behavior: smooth;
    }


    body {

      margin: 0;

      min-height: 100vh;

      color: var(--text);

      font-family:
        Arial,
        sans-serif;

      background:

        radial-gradient(
          circle at 20% 0%,
          rgba(40,217,233,.13),
          transparent 28%
        ),

        radial-gradient(
          circle at 90% 20%,
          rgba(72,223,154,.06),
          transparent 25%
        ),

        linear-gradient(
          180deg,
          #07111f,
          #081421
        );

    }


    .app {

      width: 100%;

      max-width: 480px;

      margin: auto;

      padding:
        18px
        16px
        100px;

    }


    /* =========================
       HEADER
    ========================= */

    .top {

      display: flex;

      align-items: center;

      justify-content: space-between;

      padding:
        10px
        0
        22px;

    }


    .brand {

      display: flex;

      align-items: center;

      gap: 11px;

    }


    .logo {

      width: 48px;

      height: 48px;

      border-radius: 16px;

      display: grid;

      place-items: center;

      font-size: 25px;

      background:

        linear-gradient(
          135deg,
          #2ce5f4,
          #147dce
        );

      box-shadow:
        0 0 24px
        rgba(40,217,233,.25);

    }


    .brand h1 {

      margin: 0;

      font-size: 22px;

      font-weight: 800;

    }


    .brand p {

      margin:
        4px
        0
        0;

      font-size: 12px;

      color: var(--muted);

    }


    .avatar {

      width: 44px;

      height: 44px;

      border-radius: 50%;

      display: grid;

      place-items: center;

      background: #17283b;

      border:
        1px
        solid
        var(--line);

      font-size: 20px;

    }


    /* =========================
       HERO CARD
    ========================= */

    .hero {

      background:

        linear-gradient(
          145deg,
          #13263b,
          #0d1928
        );

      border:
        1px
        solid
        #24445b;

      border-radius: 24px;

      padding: 22px;

      margin-bottom: 16px;

      box-shadow:
        0 12px 40px
        rgba(0,0,0,.18);

    }


    .hero small {

      color: var(--muted);

      font-size: 13px;

    }


    .balance {

      font-size: 42px;

      font-weight: 800;

      margin:
        8px
        0;

      letter-spacing: -1px;

    }


    .balance span {

      font-size: 18px;

      color: var(--cyan);

    }


    .substats {

      display: grid;

      grid-template-columns:
        1fr
        1fr;

      gap: 10px;

      margin-top: 18px;

    }


    .mini {

      background:
        rgba(5,12,22,.5);

      border:
        1px
        solid
        var(--line);

      border-radius: 16px;

      padding: 13px;

    }


    .mini small {

      display: block;

      margin-bottom: 7px;

      color: var(--muted);

    }


    .mini b {

      font-size: 18px;

    }


    /* =========================
       LEVEL
    ========================= */

    .level {

      margin-top: 20px;

    }


    .level-row {

      display: flex;

      justify-content: space-between;

      margin-bottom: 8px;

      font-size: 13px;

      color: var(--muted);

    }


    .bar {

      height: 9px;

      background: #07111d;

      border-radius: 30px;

      overflow: hidden;

    }


    .fill {

      width: 0%;

      height: 100%;

      border-radius: 30px;

      background:

        linear-gradient(
          90deg,
          #24cfe0,
          #58e8b1
        );

      transition:
        width
        .4s
        ease;

    }


    /* =========================
       QUICK ACTIONS
    ========================= */

    .quick {

      display: grid;

      grid-template-columns:
        repeat(3,1fr);

      gap: 10px;

      margin-bottom: 24px;

    }


    .quick button {

      border:
        1px
        solid
        var(--line);

      border-radius: 17px;

      padding: 14px 7px;

      background: var(--card);

      color: var(--text);

      cursor: pointer;

      font-size: 12px;

    }


    .quick-icon {

      display: block;

      font-size: 23px;

      margin-bottom: 6px;

    }


    /* =========================
       SECTION
    ========================= */

    .section {

      margin-bottom: 25px;

    }


    .section-head {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 12px;

    }


    .section-head h2 {

      margin: 0;

      font-size: 20px;

    }


    .section-head span {

      color: var(--cyan);

      font-size: 13px;

    }


    /* =========================
       TASKS
    ========================= */

    .task {

      display: flex;

      align-items: center;

      gap: 13px;

      padding: 15px;

      margin-bottom: 10px;

      background: var(--card);

      border:
        1px
        solid
        var(--line);

      border-radius: 19px;

    }


    .task-icon {

      width: 48px;

      height: 48px;

      flex-shrink: 0;

      display: grid;

      place-items: center;

      border-radius: 15px;

      background: var(--card-dark);

      font-size: 23px;

    }


    .task-info {

      flex: 1;

    }


    .task-info h3 {

      margin: 0 0 5px;

      font-size: 15px;

    }


    .task-info p {

      margin: 0;

      color: var(--muted);

      font-size: 12px;

    }


    .reward {

      color: var(--green);

      font-weight: bold;

      font-size: 12px;

      margin-top: 5px !important;

    }


    .task button {

      border: none;

      border-radius: 12px;

      padding:
        10px
        13px;

      background: var(--cyan);

      color: #06131d;

      font-weight: bold;

      cursor: pointer;

    }


    .task.completed {

      opacity: .65;

      border-color:
        rgba(72,223,154,.3);

    }


    .task.completed button {

      background:
        rgba(72,223,154,.18);

      color: var(--green);

    }


    /* =========================
       DAILY
    ========================= */

    .daily-card {

      padding: 20px;

      border-radius: 22px;

      background:

        linear-gradient(
          135deg,
          rgba(40,217,233,.12),
          rgba(72,223,154,.07)
        );

      border:
        1px
        solid
        rgba(40,217,233,.25);

    }


    .daily-top {

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

    }


    .daily-top h3 {

      margin: 0 0 7px;

    }


    .daily-top p {

      margin: 0;

      color: var(--muted);

      font-size: 13px;

    }


    .daily-icon {

      font-size: 38px;

    }


    .claim-btn {

      width: 100%;

      margin-top: 18px;

      padding: 14px;

      border: none;

      border-radius: 15px;

      background:

        linear-gradient(
          135deg,
          #28d9e9,
          #34b9dd
        );

      color: #06131d;

      font-size: 15px;

      font-weight: bold;

      cursor: pointer;

    }


    .claim-btn:disabled {

      opacity: .5;

    }


    /* =========================
       REFERRAL
    ========================= */

    .referral {

      padding: 20px;

      border-radius: 22px;

      background: var(--card);

      border:
        1px
        solid
        var(--line);

    }


    .referral h3 {

      margin-top: 0;

    }


    .referral p {

      color: var(--muted);

      font-size: 13px;

      line-height: 1.5;

    }


    .referral-row {

      display: flex;

      gap: 9px;

      margin-top: 14px;

    }


    .referral input {

      flex: 1;

      min-width: 0;

      border:
        1px
        solid
        var(--line);

      background: var(--card-dark);

      color: var(--muted);

      padding: 12px;

      border-radius: 12px;

      outline: none;

    }


    .copy-btn {

      border: none;

      border-radius: 12px;

      padding:
        0
        15px;

      background: var(--cyan);

      font-weight: bold;

      cursor: pointer;

    }


    /* =========================
       WALLET
    ========================= */

    .wallet-card {

      padding: 20px;

      border-radius: 22px;

      background: var(--card);

      border:
        1px
        solid
        var(--line);

    }


    .wallet-top {

      display: flex;

      justify-content: space-between;

      align-items: center;

    }


    .wallet-top h3 {

      margin: 0;

    }


    .wallet-status {

      margin-top: 12px;

      padding: 12px;

      border-radius: 13px;

      background: var(--card-dark);

      color: var(--muted);

      font-size: 13px;

    }


    .connect-btn {

      width: 100%;

      margin-top: 13px;

      padding: 14px;

      border: none;

      border-radius: 14px;

      background: #0088cc;

      color: white;

      font-weight: bold;

      cursor: pointer;

    }


    /* =========================
       BOTTOM NAV
    ========================= */

    .bottom-nav {

      position: fixed;

      bottom: 0;

      left: 50%;

      transform:
        translateX(-50%);

      width: 100%;

      max-width: 480px;

      display: flex;

      justify-content: space-around;

      padding:
        10px
        6px
        18px;

      background:
        rgba(8,20,33,.96);

      backdrop-filter:
        blur(15px);

      border-top:
        1px
        solid
        var(--line);

      z-index: 100;

    }


    .nav-item {

      flex: 1;

      text-align: center;

      color: var(--muted);

      font-size: 11px;

      cursor: pointer;

    }


    .nav-item span {

      display: block;

      font-size: 21px;

      margin-bottom: 4px;

    }


    .nav-item.active {

      color: var(--cyan);

    }


    @media(max-width:360px) {

      .balance {

        font-size: 36px;

      }

      .task {

        padding: 12px;

      }

      .task-icon {

        width: 42px;

        height: 42px;

      }

    }

  </style>
</head>


<body>

<div class="app">


  <!-- HEADER -->

  <header class="top">

    <div class="brand">

      <div class="logo">
        🚀
      </div>

      <div>

        <h1>
          NovaDrop
        </h1>

        <p id="welcomeText">
          Your earning journey
        </p>

      </div>

    </div>


    <div class="avatar">
      👤
    </div>

  </header>



  <!-- HERO -->

  <section class="hero">

    <small>
      TOTAL BALANCE
    </small>


    <div class="balance">

      <span id="coins">
        0
      </span>

      <span>
        NOVA
      </span>

    </div>


    <div class="substats">

      <div class="mini">

        <small>
          Level
        </small>

        <b>
          Lv. <span id="level">1</span>
        </b>

      </div>


      <div class="mini">

        <small>
          Total XP
        </small>

        <b>
          <span id="xp">0</span> XP
        </b>

      </div>

    </div>


    <div class="level">

      <div class="level-row">

        <span>
          Progress
        </span>

        <span id="xpText">
          0 / 100 XP
        </span>

      </div>


      <div class="bar">
