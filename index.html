<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>NovaDrop</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- TON Connect -->
  <script src="https://unpkg.com/@tonconnect/ui@2.0.9/dist/tonconnect-ui.min.js"></script>

</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header class="header">

    <div class="logo">
      🚀
    </div>

    <h1>
      NovaDrop
    </h1>

    <p>
      Complete tasks, earn points and unlock rewards!
    </p>

  </header>


  <!-- PROGRESS -->

  <section class="points-card">

    <h3>
      ⭐ Your Progress
    </h3>

    <div class="stats">

      <div class="stat">

        <span>
          🪙 Coins
        </span>

        <strong id="coins">
          0
        </strong>

      </div>


      <div class="stat">

        <span>
          ⚡ XP
        </span>
